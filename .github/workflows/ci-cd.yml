name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mail-be

jobs:
  # ============================================
  # STAGE 1: Security - Secret Scanning
  # ============================================
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking - advisory only
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          chmod +x gitleaks
          rm gitleaks_8.18.4_linux_x64.tar.gz

      - name: Run Gitleaks
        run: ./gitleaks detect --source src/ --no-git --verbose

  # ============================================
  # STAGE 2: Code Quality
  # ============================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking - advisory only
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check code formatting (Spotless)
        run: mvn spotless:check --batch-mode

  # ============================================
  # STAGE 3: Unit Tests
  # ============================================
  test:
    name: Run Unit Tests
    needs: [gitleaks, code-quality]
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking - tests can fail without stopping pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test --batch-mode

  # ============================================
  # STAGE 4: Build & Push Docker Image
  # ============================================
  build-and-push:
    name: Build & Push Docker Image
    needs: [gitleaks, code-quality]  # Removed test dependency - tests run in parallel
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # STAGE 5: Security - Docker Image Scan
  # ============================================
  scan-image:
    name: Scan Docker Image
    needs: build-and-push
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking - security advisory only
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ============================================
  # STAGE 6: Deploy
  # ============================================
  deploy:
    name: Deploy to Render
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy via API
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Accept: application/json" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": "do_not_clear"}'