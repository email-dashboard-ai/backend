server:
  port: 3000
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true



# Database Configuration
# Uses "db" as default host (Docker service name), "localhost" as fallback
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emaildb}${DB_PARAMS:}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secure_db_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 900000
  refresh-expiration: 604800000

# Google OAuth
google:
  client:
    id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
    secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
  application:
    name: email-client

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Swagger Server Configuration
swagger:
  server:
    url: ${SWAGGER_SERVER_URL:http://localhost:3000}
    description: ${SWAGGER_SERVER_DESCRIPTION:Local Development}

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  google:
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    redirect-uri: ${GOOGLE_REDIRECT_URI:postmessage}
  gmail:
    default-limit: 50
