server:
  port: 3000
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true

# Database Configuration
# Uses "db" as default host (Docker service name), "localhost" as fallback
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emaildb}${DB_PARAMS:}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secure_db_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 25MB # Maximum size for a single file
      max-request-size: 50MB # Maximum size for the entire request (all files combined)

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

# Google OAuth
google:
  client:
    id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
    secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
  application:
    name: email-client

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Swagger Server Configuration
swagger:
  server:
    url: ${SWAGGER_SERVER_URL:http://localhost:3000}
    description: ${SWAGGER_SERVER_DESCRIPTION:Local Development}

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  google:
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    redirect-uri: ${GOOGLE_REDIRECT_URI:postmessage}
  gmail:
    default-limit: 50

# AI Summarization
ai:
  provider: ${AI_PROVIDER:gemini}
  timeout-ms: ${AI_TIMEOUT_MS:15000}
  max-input-chars: ${AI_MAX_INPUT_CHARS:12000}
  cache:
    ttl-seconds: ${AI_CACHE_TTL_SECONDS:86400}
    max-entries: ${AI_CACHE_MAX_ENTRIES:2000}
  gemini:
    api-key: ${GOOGLE_AI_STUDIO_API_KEY:}
    model: ${AI_GEMINI_MODEL:gemini-2.5-flash}
    max-output-tokens: ${AI_GEMINI_MAX_OUTPUT_TOKENS:120}
    temperature: ${AI_GEMINI_TEMPERATURE:0.2}
