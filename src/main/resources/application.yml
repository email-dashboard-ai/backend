server:
  port: 3000
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true

# Database Configuration
# Uses "db" as default host (Docker service name), "localhost" as fallback
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emaildb}${DB_PARAMS:}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secure_db_password}
  jpa:
    hibernate:
      # TEMPORARY: Using create-drop to fix database schema
      # Change back to 'update' after first successful startup
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 25MB # Maximum size for a single file
      max-request-size: 50MB # Maximum size for the entire request (all files combined)

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

# Google OAuth
# IMPORTANT: Add your credentials to application-local.yml (not tracked by git)
# Or set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET environment variables
google:
  client:
    id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
    secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
  application:
    name: email-client

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Swagger Server Configuration
swagger:
  server:
    url: ${SWAGGER_SERVER_URL:http://localhost:3000}
    description: ${SWAGGER_SERVER_DESCRIPTION:Local Development}

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  google:
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    redirect-uri: ${GOOGLE_REDIRECT_URI:postmessage}
    connect-timeout-ms: ${GOOGLE_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${GOOGLE_READ_TIMEOUT_MS:20000}
  gmail:
    default-limit: ${GMAIL_DEFAULT_LIMIT:20}
    max-limit: ${GMAIL_MAX_LIMIT:50}
  sync:
    retention-days: ${SYNC_RETENTION_DAYS:45}

# AI Summarization
ai:
  provider: ${AI_PROVIDER:gemini}
  timeout-ms: ${AI_TIMEOUT_MS:15000}
  max-input-chars: ${AI_MAX_INPUT_CHARS:12000}
  summary-prompt: ${AI_SUMMARY_PROMPT:You are an email assistant. Summarize the following email in 1-2 concise sentences for a Kanban task card. Focus on the main action required or key information, who is involved, and any deadlines if mentioned. Ignore greetings, signatures, and promotional content. Be direct and actionable.}
  cache:
    ttl-seconds: ${AI_CACHE_TTL_SECONDS:86400}
    max-entries: ${AI_CACHE_MAX_ENTRIES:2000}
  gemini:
    api-key: ${GOOGLE_AI_STUDIO_API_KEY:}
    model: ${AI_GEMINI_MODEL:gemini-2.5-flash}
    max-output-tokens: ${AI_GEMINI_MAX_OUTPUT_TOKENS:120}
    temperature: ${AI_GEMINI_TEMPERATURE:0.2}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${AI_GROQ_MODEL:llama-3.3-70b-versatile}
    max-output-tokens: ${AI_GROQ_MAX_OUTPUT_TOKENS:120}
    temperature: ${AI_GROQ_TEMPERATURE:0.2}
